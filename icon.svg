<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="court" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#15803d" />
      <stop offset="100%" stop-color="#166534" />
    </linearGradient>
    <linearGradient id="ball" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ecfccb" />
      <stop offset="30%" stop-color="#ccff00" />
      <stop offset="100%" stop-color="#84cc16" />
    </linearGradient>
    <linearGradient id="racket" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />

  <!-- Tennis Court lines stylized -->
  <path d="M 64 360 L 448 360" stroke="#ffffff" stroke-width="6" opacity="0.4" />
  <path d="M 160 360 L 190 440" stroke="#ffffff" stroke-width="4" opacity="0.3" />
  <path d="M 352 360 L 322 440" stroke="#ffffff" stroke-width="4" opacity="0.3" />

  <!-- Tennis Racket -->
  <g transform="translate(190, 160) rotate(-35)">
    <!-- Racket Handle -->
    <rect x="-14" y="110" width="28" height="130" rx="10" fill="#1e293b" stroke="#f8fafc" stroke-width="4" />
    <rect x="-10" y="125" width="20" height="100" rx="4" fill="#38bdf8" opacity="0.8" />
    <!-- Throat -->
    <path d="M -16 110 L -26 70 L 26 70 L 16 110 Z" fill="#475569" stroke="#f8fafc" stroke-width="4" />
    <!-- Head Rim -->
    <ellipse cx="0" cy="0" rx="76" ry="94" fill="none" stroke="url(#racket)" stroke-width="16" />
    <!-- Strings -->
    <line x1="-50" y1="-50" x2="50" y2="-50" stroke="#ffffff" stroke-width="2" opacity="0.4" />
    <line x1="-65" y1="-25" x2="65" y2="-25" stroke="#ffffff" stroke-width="2" opacity="0.4" />
    <line x1="-70" y1="0" x2="70" y2="0" stroke="#ffffff" stroke-width="2" opacity="0.4" />
    <line x1="-65" y1="25" x2="65" y2="25" stroke="#ffffff" stroke-width="2" opacity="0.4" />
    <line x1="-50" y1="50" x2="50" y2="50" stroke="#ffffff" stroke-width="2" opacity="0.4" />
    <line x1="-40" y1="-70" x2="-40" y2="70" stroke="#ffffff" stroke-width="2" opacity="0.4" />
    <line x1="-20" y1="-85" x2="-20" y2="85" stroke="#ffffff" stroke-width="2" opacity="0.4" />
    <line x1="0" y1="-90" x2="0" y2="90" stroke="#ffffff" stroke-width="2" opacity="0.4" />
    <line x1="20" y1="-85" x2="20" y2="85" stroke="#ffffff" stroke-width="2" opacity="0.4" />
    <line x1="40" y1="-70" x2="40" y2="70" stroke="#ffffff" stroke-width="2" opacity="0.4" />
  </g>

  <!-- Glowing Tennis Ball -->
  <g transform="translate(350, 150)" filter="url(#glow)">
    <circle cx="0" cy="0" r="54" fill="url(#ball)" />
    <!-- Tennis Ball Seams -->
    <path d="M -38 -20 C -15 -10, -15 10, -38 20" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.9" />
    <path d="M 38 -20 C 15 -10, 15 10, 38 20" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.9" />
  </g>

  <!-- Motion Speed Trails -->
  <path d="M 270 210 Q 300 180 320 160" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" opacity="0.8" />
  <path d="M 285 240 Q 320 205 340 185" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" opacity="0.6" />
</svg>
